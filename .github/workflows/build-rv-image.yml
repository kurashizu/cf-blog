name: Build RISC-V image

# Manual only, like its x86 sibling — this writes to R2, and it is slow: there
# is no riscv64 runner, so apk and mke2fs run under QEMU user emulation.
on:
    workflow_dispatch:
        inputs:
            alpine_version:
                description: "Alpine release series"
                default: "3.24"
            kernel_flavor:
                description: "Kernel flavour"
                default: "lts"
            publish:
                description: "Upload to R2 (uncheck to build and inspect only)"
                type: boolean
                default: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v6

            - name: Register QEMU for riscv64
              uses: docker/setup-qemu-action@v3
              with:
                  platforms: riscv64

            - name: Build firmware, kernel, initramfs and root filesystem
              # Native riscv64 tooling under emulation rather than a cross-build:
              # apk's triggers and mkinitfs both want to run target binaries, and
              # QEMU is a far shorter road to that than a cross toolchain.
              run: |
                  mkdir -p out
                  docker run --rm --platform linux/riscv64 \
                    -e ALPINE_VERSION='${{ inputs.alpine_version }}' \
                    -e KERNEL_FLAVOR='${{ inputs.kernel_flavor }}' \
                    -v "$PWD/out:/out" \
                    -v "$PWD/landing-worker/scripts/build-rv-image.sh:/build.sh:ro" \
                    alpine:${{ inputs.alpine_version }} sh /build.sh

            - name: Take ownership and record sizes
              run: |
                  sudo chown -R "$USER:$USER" out
                  ls -l out
                  sha256sum out/* > out/SHA256SUMS
                  cat out/SHA256SUMS

            - name: Publish to R2
              if: ${{ inputs.publish }}
              working-directory: landing-worker
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  for path in ../out/bios.bin ../out/kernel ../out/initramfs ../out/rootfs.img.*; do
                    npx wrangler r2 object put "public-files/rv/$(basename "$path")" \
                      --file "$path" \
                      --content-type application/octet-stream \
                      --remote
                  done

            - uses: actions/upload-artifact@v5
              with:
                  name: krsz-rv-kernel
                  path: |
                      out/bios.bin
                      out/kernel
                      out/initramfs
                      out/SHA256SUMS
                  retention-days: 14
