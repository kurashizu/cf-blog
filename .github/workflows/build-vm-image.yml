name: Build VM image

# Manual only: this writes to R2 and the artifacts change rarely. Re-run it when
# bumping the Alpine version or changing scripts/build-vm-image.sh.
on:
    workflow_dispatch:
        inputs:
            alpine_version:
                description: "Alpine release series"
                default: "3.24"
            kernel_flavor:
                description: "Kernel flavour (lts or virt)"
                default: "lts"
            image_mb:
                description: "Root filesystem size, MB"
                default: "512"
            publish:
                description: "Upload to R2 (uncheck to build and inspect only)"
                type: boolean
                default: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Build kernel, initramfs and root filesystem
              # A 32-bit Alpine container so apk, mkinitfs and the target binaries
              # are all native x86 — no cross-build and no qemu. Nothing here needs
              # privileges: mke2fs -d populates the image from a directory, so
              # there is no loop mount.
              run: |
                  mkdir -p out
                  docker run --rm \
                    -e ALPINE_VERSION='${{ inputs.alpine_version }}' \
                    -e KERNEL_FLAVOR='${{ inputs.kernel_flavor }}' \
                    -e IMAGE_MB='${{ inputs.image_mb }}' \
                    -v "$PWD/out:/out" \
                    -v "$PWD/landing-worker/scripts/build-vm-image.sh:/build.sh:ro" \
                    i386/alpine:${{ inputs.alpine_version }} sh /build.sh

            - name: Take ownership and record sizes
              id: sizes
              # The container writes as root, so nothing else on the runner can
              # read the output until it is chowned.
              run: |
                  sudo chown -R "$USER:$USER" out
                  {
                    echo "vmlinuz=$(stat -c %s out/vmlinuz)"
                    echo "initramfs=$(stat -c %s out/initramfs)"
                    echo "rootfs=$(stat -c %s out/rootfs.img)"
                  } >> "$GITHUB_OUTPUT"
                  ls -l out
                  sha256sum out/* > out/SHA256SUMS
                  cat out/SHA256SUMS

            - name: Publish to R2
              if: ${{ inputs.publish }}
              working-directory: landing-worker
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  for f in vmlinuz initramfs rootfs.img; do
                    npx wrangler r2 object put "public-files/vm/$f" \
                      --file "../out/$f" \
                      --content-type application/octet-stream \
                      --remote
                  done

            # Only the small pieces: the root filesystem belongs in R2, and zipping
            # half a gigabyte on every run to throw it away in a week is waste.
            - uses: actions/upload-artifact@v5
              with:
                  name: krsz-vm-kernel
                  path: |
                      out/vmlinuz
                      out/initramfs
                      out/SHA256SUMS
                  retention-days: 7

            - name: Configuration to apply
              run: |
                  {
                    echo "### VM image built"
                    echo
                    echo 'Set `VM_IMAGES` in `landing-worker/wrangler.toml` to:'
                    echo
                    echo '```toml'
                    echo "VM_IMAGES = \"vmlinuz|r2:vm/vmlinuz|${{ steps.sizes.outputs.vmlinuz }},initramfs|r2:vm/initramfs|${{ steps.sizes.outputs.initramfs }},rootfs|r2:vm/rootfs.img|${{ steps.sizes.outputs.rootfs }}\""
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
