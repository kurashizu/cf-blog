name: Build QEMU (wasm)

# One architecture per run. Each is a full QEMU build under Emscripten and takes
# the better part of an hour, so batching them only delays finding out that
# something is wrong.
on:
    workflow_dispatch:
        inputs:
            target:
                description: "Guest architecture (aarch64, riscv64, x86_64)"
                default: "aarch64"
            qemu_ref:
                description: "Branch or tag of ktock/qemu-wasm"
                default: "master"
            publish:
                description: "Upload to R2 (uncheck to build and inspect only)"
                type: boolean
                default: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 300
        steps:
            - uses: actions/checkout@v6

            - name: Free up disk space
              # A QEMU build tree plus the toolchain image does not fit next to
              # everything a stock runner ships with.
              run: |
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
                  df -h /

            - name: Build QEMU for the browser
              env:
                  TARGET: ${{ inputs.target }}
                  QEMU_REF: ${{ inputs.qemu_ref }}
                  OUT: ${{ github.workspace }}/out
              run: bash landing-worker/scripts/build-qemu-wasm.sh

            - name: Record sizes
              run: ls -l out && sha256sum out/* | tee out/SHA256SUMS

            - name: Publish to R2
              # Not shipped as a static asset: the wasm is tens of megabytes and
              # Workers refuse a single asset over 25 MiB. It goes where the disk
              # images already go, and is served through the same proxy.
              if: ${{ inputs.publish }}
              working-directory: landing-worker
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  target='${{ inputs.target }}'
                  put() {
                    npx wrangler r2 object put "public-files/qemu/$2" \
                      --file "../out/$1" --content-type "$3" --remote
                  }
                  # The content types matter: a wasm served as anything else is
                  # refused by streaming compilation, and the glue is a module.
                  put "qemu-system-$target" "qemu-system-$target.js" "text/javascript"
                  put "qemu-system-$target.wasm" "qemu-system-$target.wasm" "application/wasm"
                  put "qemu-system-$target.worker.js" "qemu-system-$target.worker.js" "text/javascript"

            - uses: actions/upload-artifact@v5
              with:
                  name: qemu-wasm-${{ inputs.target }}
                  path: out/*
                  retention-days: 14
