name = "cf-landing"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

main = ".svelte-kit/cloudflare/_worker.js"

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

# Custom domains (apex + www.apex, e.g. `krsz.in` + `www.krsz.in`) are
# configured in the Cloudflare Dashboard — not declared here on purpose.
# Apex domain is centralized in `shared/site-config.ts` (APEX_DOMAIN).

# Network relay for the (upcoming) Linux VM view — `src/routes/net/+server.ts`.
# The endpoint and its token are secrets, so this public repo never carries them:
#   npx wrangler secret put OMNIPROXY_URL     # e.g. https://host.example/
#   npx wrangler secret put OMNIPROXY_TOKEN   # sent upstream as x-proxy-token
# With OMNIPROXY_URL unset the route answers 503 and the rest of the site is
# unaffected. The allowlist below is not sensitive and lives here instead, so
# what the relay may reach is reviewable in git rather than write-only.

# Per-IP budget on relay connections. One VM opens one socket, so this is far
# above normal use and only bites a reconnect loop or a scripted abuser.
[[ratelimits]]
name = "NET_RATE_LIMIT"
namespace_id = "2001"
  [ratelimits.simple]
  limit = 10
  period = 60

# VM images live under vm/ in the shared public bucket, written by the
# build-vm-image workflow.
[[r2_buckets]]
binding = "VM_BUCKET"
bucket_name = "public-files"

[vars]
# Destinations the relay may reach: `host` or `host:port`, comma separated.
# Matching is suffix-at-label-boundary, so "alpinelinux.org" covers
# "dl-cdn.alpinelinux.org" but not "evil-alpinelinux.org". A port-pinned entry
# matches only that port, and a portless frame (ICMP) matches only entries that
# pin no port. "*" disables the check entirely; an empty value blocks everything.
OMNIPROXY_ALLOW = "*:80,*:443"

# VM disk images served to v86 by `src/routes/vm/img/[name]/+server.ts`, as
# `name|url|size` triples. Upstream sends no CORS headers, so it has to be
# proxied; the proxy caches 1 MiB chunks at the edge, which is what makes a
# 49 MiB ISO practical to boot more than once. Point these at R2 later without
# touching any code.
VM_IMAGES = "vmlinuz|r2:vm/vmlinuz#b12|8651264,initramfs|r2:vm/initramfs#b12|9744966,rootfs|r2:vm/rootfs.img@209715200#b12|896532480,alpine|https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86/alpine-virt-3.24.1-x86.iso|51380224"

[observability]
enabled = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
