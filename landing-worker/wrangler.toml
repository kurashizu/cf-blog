name = "cf-landing"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist"
not_found_handling = "single-page-application"


# Custom domains (apex + www.apex, e.g. `krsz.in` + `www.krsz.in`) are
# configured in the Cloudflare Dashboard — not declared here on purpose.
# Apex domain is centralized in `shared/site-config.ts` (APEX_DOMAIN).

[observability]
enabled = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
