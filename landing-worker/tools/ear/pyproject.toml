[project]
name = "ear"
version = "0.1.0"
description = "Listens to synth renders the way the preset tests cannot: which instrument an AudioSet model hears."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "numpy",
    "soundfile",
    "scipy",
    "cma>=4.5.0",
]

[tool.uv]
package = false
