name = "cf-agent"
main = ".open-next/worker.js"
compatibility_date = "2026-04-30"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Shared with cf-blog / cf-blog-cache. cf-agent uses it only to write the
# inbound request audit trail (`api_access_log`), so /api/chat and /api/tool
# calls — the biggest consumers of Gemini and Brave quota — are traceable
# back to a caller in the same admin view as the blog's own routes.
[[d1_databases]]
binding = "DB"
database_name = "cf-blog-db"
database_id = "f763e00a-1c8b-42d4-ad4f-65d0136cabd2"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "757683a8bedf4c53bd20854f6e0f27bb"
preview_id = "d299a8b14f4a4fc0993a319e091111e9"

# Rate Limiting — CF Rate Limiter (burst) + KV (daily)
# Agent: /api/chat 2/10s burst, 100/day | /api/tool 10/10s burst, 200/day

[[ratelimits]]
name = "CHAT_RATE_LIMIT"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 2
  period = 10

[[ratelimits]]
name = "TOOL_RATE_LIMIT"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 10
  period = 10

[vars]
GEMINI_MODELS = '["gemma-4-31b-it", "gemma-4-26b-a4b-it"]'
